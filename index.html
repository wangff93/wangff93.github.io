<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>某某人的个人主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* ── Hero ── */
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
        }
        .hero h1 {
            font-size: 2.4em;
            color: #fff;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }
        .hero p {
            font-size: 1.1em;
            color: #a8a4ce;
            line-height: 1.8;
        }

        /* ── Section Title ── */
        .section-title {
            text-align: center;
            font-size: 1.4em;
            color: #fff;
            margin: 40px 0 24px;
            position: relative;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #6c63ff, #e94560);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* ── Project Grid ── */
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .project-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 32px 28px;
            text-decoration: none;
            color: #e0e0e0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .project-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #6c63ff, #e94560);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .project-card:hover {
            transform: translateY(-6px);
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 12px 40px rgba(108,99,255,0.15);
        }
        .project-card:hover::before {
            opacity: 1;
        }

        .project-icon {
            font-size: 2.8em;
            margin-bottom: 16px;
            display: block;
        }

        .project-card h3 {
            font-size: 1.3em;
            color: #fff;
            margin-bottom: 8px;
        }

        .project-card .tag {
            display: inline-block;
            font-size: 0.75em;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .tag-html { background: rgba(227,79,38,0.2); color: #e34f26; }
        .tag-vue  { background: rgba(65,184,131,0.2); color: #41b883; }

        .project-card p {
            font-size: 0.95em;
            color: #a8a4ce;
            line-height: 1.6;
        }

        .project-card .arrow {
            position: absolute;
            bottom: 28px;
            right: 28px;
            font-size: 1.2em;
            color: #6c63ff;
            opacity: 0;
            transform: translateX(-8px);
            transition: all 0.3s ease;
        }
        .project-card:hover .arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* ── Footer ── */
        footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            color: #5a567a;
            font-size: 0.85em;
        }
        footer a {
            color: #6c63ff;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }

        /* ── Responsive ── */
        @media (max-width: 400px) {
            .hero h1 { font-size: 1.8em; }
            .projects { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Hero -->
        <div class="hero">
            <h1>你好，我是某某人 👋</h1>
            <p>是一个帅气阳光大逗逼，欢迎来到我的个人网站！</p>
        </div>

        <!-- Projects -->
        <div class="section-title">🚀 我的作品</div>

        <div class="projects">
            <!-- 贪吃蛇 -->
            <a class="project-card" href="https://wangff93.github.io/tcs/">
                <span class="project-icon">🐍</span>
                <h3>贪吃蛇</h3>
                <span class="tag tag-html">HTML5 Canvas</span>
                <p>经典贪吃蛇游戏，霓虹风格，支持键盘和触屏操控，速度随果实数动态递增</p>
                <span class="arrow">→</span>
            </a>

            <!-- 烟消云散 -->
            <a class="project-card" href="https://wangff93.github.io/jieyan/">
                <span class="project-icon">💨</span>
                <h3>烟消云散</h3>
                <span class="tag tag-vue">Vue</span>
                <p>科学戒烟记录平台，用数据记录和科学方法辅助戒烟之旅</p>
                <span class="arrow">→</span>
            </a>

            <!-- 发型 -->
            <a class="project-card" href="https://wangff93.github.io/faxing/">
                <span class="project-icon">💈</span>
                <h3>发型</h3>
                <span class="tag tag-vue">Vue</span>
                <p>发型相关的 Vue 项目</p>
                <span class="arrow">→</span>
            </a>

            <!-- 从无 -->
            <a class="project-card" href="https://wangff93.github.io/congwu/">
                <span class="project-icon">✨</span>
                <h3>从无</h3>
                <span class="tag tag-html">HTML</span>
                <p>个人创意项目</p>
                <span class="arrow">→</span>
            </a>
        </div>

        <!-- Footer -->
        <footer>
            <p>© 2026 某某人 · <a href="https://github.com/wangff93" target="_blank">GitHub</a></p>
        </footer>
    </div>
</body>
</html>
